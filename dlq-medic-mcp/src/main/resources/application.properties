spring.application.name=dlq-medic-mcp
server.port=8081
# Local-only credentials come from the repo-root .env (generated by scripts/init-env.sh)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.ai.mcp.server.name=dlq-medic
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.enable-auto-commit=false

# Least-privilege login: read-only on orders/ledger, append-only audit log
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=orders_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=dlq_medic
spring.datasource.password=${DLQ_MEDIC_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4

logging.level.org.apache.kafka=WARN

# Email via the local Mailpit SMTP server (docker-compose). Web inbox: http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
# The only addresses the agent can email: it picks a team name, never an address
dlqmedic.notify.from=dlq-medic@example.com
dlqmedic.notify.teams.checkout-team=checkout-team@example.com
dlqmedic.notify.teams.oncall=oncall@example.com
