spring.application.name=order-consumer
# Local-only credentials come from the repo-root .env (generated by scripts/init-env.sh)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=3

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=orders_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=order_svc
spring.datasource.password=${ORDER_SVC_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4

logging.level.org.apache.kafka=WARN
